[project]
name = "popsim-transport-predictor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "disruption-py",
    "popsim",
    "torax",
    "pre-commit>=4.3.0",
    "xarray",
    "netcdf4",
    "fire>=0.7.1",
    "pydantic-settings>=2.12.0",
    "dynaconf>=3.2.12",
    "wandb>=0.25.0",
    "srunx>=2.2.1",
    "mkgp>=3.1.4",
    "threadpoolctl>=3.6.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "debugpy>=1.8.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

gpu-orcd = [
    "jax[cuda13]>=0.8.1,<0.9",
]

[tool.isort]
profile = "black"

[tool.setuptools]
packages = ["transport_study"]

[tool.uv.sources]
disruption-py = { path = "./submodules/disruption-py", editable = true }
popsim = { path = "./submodules/popsim-public", editable = true }
torax = { path = "./submodules/torax", editable = true }

[tool.uv]
override-dependencies = [
  "jax[cuda13]>=0.8.1,<0.9",
]

[tool.hatch.build.targets.sdist]
include = ["transport_study"]

[tool.hatch.build.targets.wheel]
include = ["transport_study"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["transport_study/tests"]
# Slow tests (model training, TORAX relaxation, figure generation, real device
# data) are opt-in: run them with `-m slow` or `-m ""`, and on a GPU node
addopts = "-m 'not slow'"
markers = [
    "slow: trains models, runs TORAX, generates figures, or needs real device data",
]
filterwarnings = [
    "ignore::DeprecationWarning:equinox", # TODO(ZanderKeith): after updating POPSIM to work with JAX 10, revisit this warning.
    "ignore::DeprecationWarning:jaxopt",
    "ignore::DeprecationWarning:wandb",
]  

[tool.ruff]
fix = true
line-length = 140
lint.select = [
  "A", # avoid shadowing
  "B", # flake8-bugbear
  "C4", # comprehensions 
  "E", # pycodestyle Errors
  "ERA", # no commented out code
  "F", # pyflakes
  "FLY", # flynt
  "I001", # isort
  "ISC", # implicit string concatenation
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PGH", # pygrep-hooks
  "PL", # pylint
  "Q", # flake8-quotes
  "RUF", # ruff builtins e.g. noqa checking
  "T10", # flake8-debugger (no breakpoint etc)
  "TCH",# type-checking imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  ]

lint.ignore = [
  "E501", # Never enforce line length violations, we have black for that.
  "PLR0913", #ignore limit on number of args
  "PLR2004", #ignore magic values warning, at least for now
  "C408", # use {} instead of dict(), but we use dict heavily, for now leave it
  "F722", # Incompatible with jaxtyping
  "E402", # False alarms on autoreload magic in Jupyter Notebooks.
  "PLC0415", # It is helpful to do function level imports for optional deps.
]

lint.pyupgrade.keep-runtime-typing=true
lint.pydocstyle.convention = "google"

[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 80


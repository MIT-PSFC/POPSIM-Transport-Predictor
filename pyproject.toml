[project]
name = "popsim-transport-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "disruption-py",
    "pre-commit>=4.3.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

[tool.isort]
profile = "black"

[tool.uv.sources]
disruption-py = { path = "submodules/disruption-py", editable = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "popsim-transport-predictor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.3.0",
    "disruption-py",
    "popsim",
    "fire>=0.7.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

[tool.isort]
profile = "black"

[tool.setuptools]
packages = ["popsim_transport_predictor"]

[tool.uv.sources]
popsim = { path = "./submodules/popsim", editable = true }
disruption-py = { path = "./submodules/disruption-py", editable = true }

[tool.hatch.build.targets.sdist]
include = ["popsim_transport_predictor"]

[tool.hatch.build.targets.wheel]
include = ["popsim_transport_predictor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

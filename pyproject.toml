[project]
name = "popsim-transport-predictor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.3.0",
    "disruption-py",
    "gptools",
    "popsim",
    "xarray",
    "netcdf4",
    "fire>=0.7.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

[tool.isort]
profile = "black"

[tool.setuptools]
packages = ["popsim_transport_predictor"]

[tool.uv.sources]
disruption-py = { path = "./submodules/disruption-py", editable = true }
gptools = { path = "./submodules/gptools", editable = true }
popsim = { path = "./submodules/popsim", editable = true }

[tool.hatch.build.targets.sdist]
include = ["popsim_transport_predictor"]

[tool.hatch.build.targets.wheel]
include = ["popsim_transport_predictor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true
lint.select = [
  "A", # avoid shadowing
  "B", # flake8-bugbear
  "C4", # comprehensions 
  "E", # pycodestyle Errors
  "ERA", # no commented out code
  "F", # pyflakes
  "FLY", # flynt
  "I001", # isort
  "ISC", # implicit string concatenation
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PGH", # pygrep-hooks
  "PL", # pylint
  "Q", # flake8-quotes
  "RUF", # ruff builtins e.g. noqa checking
  "T10", # flake8-debugger (no breakpoint etc)
  "TCH",# type-checking imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  ]

lint.ignore = [
  "E501", # Never enforce line length violations, we have black for that.
  "PLR0913", #ignore limit on number of args
  "PLR2004", #ignore magic values warning, at least for now
  "C408", # use {} instead of dict(), but we use dict heavily, for now leave it
  "F722", # Incompatible with jaxtyping
  "E402", # False alarms on autoreload magic in Jupyter Notebooks.
  "PLC0415", # It is helpful to do function level imports for optional deps.
]

lint.pyupgrade.keep-runtime-typing=true
lint.pydocstyle.convention = "google"


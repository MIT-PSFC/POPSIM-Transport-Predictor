# TCV Dataset Configuration

[data_sources]
# Default path to directory containing individual TCV dataset files
# Each file in this directory corresponds to a single shot
default_source_dir = "/usr/local/mfe/ml_data_dump/TCV/DB_nc"

[shotlist_query]
# For TCV, shotlist is retrieved from the source directory
# No SQL database query needed
use_source_dir = true

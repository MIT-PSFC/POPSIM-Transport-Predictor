method: bayes
metric:
  name: "val/loss.mean"
  goal: "minimize"
early_terminate:
  type: hyperband
  min_iter: 2
  eta: 3
parameters:
  model_init_config:
    parameters:
      # Width and depth are shared by the three coefficient MLPs (transport, sources, edge).
      # No t_final / n_solver_steps sweep: the transport predictor advances exactly one
      # solver step of the dataset timebase per call (sim_dt is fixed)
      nn_width:
        values: [8, 16, 32, 64]
      nn_depth:
        values: [1, 2, 3, 4]
  optimizer_config:
    parameters:
      lr0:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0e-2
      # Final learning rate as a fraction of lr0, never above it
      lrf_frac:
        distribution: log_uniform_values
        min: 1.0e-3
        max: 1.0
      weight_decay:
        distribution: log_uniform_values
        min: 1.0e-6
        max: 0.1
      # Fraction of the run's optimizer steps per 10x learning-rate decay,
      # resolved to transition_steps from the run's own steps_per_epoch * max_epochs at train time.
      # Horizon-invariant, a tuned schedule carries over to other epoch budgets and batch sizes
      transition_frac:
        distribution: log_uniform_values
        min: 0.03
        max: 3.0
      # Only ln(decay_rate) / transition_frac shapes the decay, so transition_frac alone sweeps it
      decay_rate:
        value: 0.1
  loss_config:
    parameters:
      # Deltas act on chi, the residual in GP-fit error bars (trb_utils.huber_profile_loss).
      # Safe to sweep, the sweep metric val/loss.mean is the delta-free
      # validation loss (TransportPredictorTRB.get_val_loss_fn)
      huber_delta:
        distribution: log_uniform_values
        min: 0.1
        max: 10.0
      # Trained models sat near 1 error bar on the values and 3-4 on the gradients, so the gradient term has its own delta
      huber_delta_grad:
        distribution: log_uniform_values
        min: 0.3
        max: 30.0

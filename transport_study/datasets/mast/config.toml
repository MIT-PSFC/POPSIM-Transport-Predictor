[data_sources]
# MAST open-access Zarr stores hosted at STFC ECHO S3
level2_endpoint = "https://s3.echo.stfc.ac.uk"
level2_path = "mast/level2/shots"
level2_ext = "zarr"

level1_endpoint = "https://s3.echo.stfc.ac.uk"
level1_path = "mast/level1/shots"
level1_efm_group = "efm"

[profile_fitting]
# Output psi_n grid for GP-fitted profiles
psi_n_min = 0.0
psi_n_max = 1.0
num_psi_points = 64
# Minimum valid (psi_n, value) pairs required per timestep to run the GP fit
min_ts_points = 20

[shot_filters]
# Minimum IP [A] for a valid MAST shot
min_ip = 100000.0
# Minimum shot duration [s] after filtering to valid signal ranges
min_duration = 0.2

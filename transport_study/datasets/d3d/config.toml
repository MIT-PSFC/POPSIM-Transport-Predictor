# DIII-D Dataset Configuration

[data_sources]
# IDA profile databases, one file per shot. Searched in priority order:
# a shot is read from the first pattern that has a file for it.
# The union across patterns also defines shot availability for the default shotlist.
ida_path_patterns = [
  "/fusion/projects/results/ida-results/HBP_database/IDA_{shot}_.cdf",
]

[profile_grid]
# Uniform rho_tor_norm grid the IDA profiles are interpolated onto
# rho_max 1.1 covers the usable part of IDA's psi_n <= 1.2 domain
rho_min = 0.0
rho_max = 1.1
num_rho_points = 64

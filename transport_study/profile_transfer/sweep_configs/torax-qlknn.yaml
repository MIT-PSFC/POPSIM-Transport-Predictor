method: bayes
metric:
  name: "val/loss.mean"
  goal: "minimize"
early_terminate:
  type: hyperband
  min_iter: 2
  eta: 3
parameters:
  model_init_config:
    parameters:
      # Width and depth are shared by the three coefficient MLPs (transport, sources, edge)
      nn_width:
        values: [8, 16, 32, 64]
      nn_depth:
        values: [1, 2, 3, 4]
      t_final:
        values: [0.1, 0.2, 0.4]
      n_solver_steps:
        values: [4, 6, 8]
  optimizer_config:
    parameters:
      lr0:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0e-2
      # Final learning rate as a fraction of lr0, never above it
      lrf_frac:
        distribution: log_uniform_values
        min: 1.0e-3
        max: 1.0
      weight_decay:
        distribution: log_uniform_values
        min: 1.0e-6
        max: 0.1
      # Fraction of the run's optimizer steps per 10x learning-rate decay,
      # resolved to transition_steps from the run's own steps_per_epoch * max_epochs at train time.
      # Horizon-invariant, a tuned schedule carries over to other epoch budgets and batch sizes
      transition_frac:
        distribution: log_uniform_values
        min: 0.03
        max: 3.0
      # Only ln(decay_rate) / transition_frac shapes the decay, so transition_frac alone sweeps it
      decay_rate:
        value: 0.1
  loss_config:
    parameters:
      # Deltas act on peak-normalized profiles, so they read as fractional errors.
      # Sweeping them is safe because the sweep metric val/loss.mean is the
      # delta-free validation loss (trb.get_val_loss_fn)
      huber_delta:
        distribution: log_uniform_values
        min: 0.01
        max: 1.0
      huber_delta_grad:
        distribution: log_uniform_values
        min: 0.1
        max: 10.0

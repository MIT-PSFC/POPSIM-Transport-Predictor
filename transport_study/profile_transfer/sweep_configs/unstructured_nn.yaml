method: bayes
metric:
  name: "val/loss.mean"
  goal: "minimize"
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
parameters:
  model_init_config:
    parameters:
      nn_width:
        values: [16, 24, 32, 40, 48, 56, 64]
      nn_depth:
        values: [2, 3, 4]
      n_points:
        values: [21, 31, 41, 51]
      softmax_temp:
        distribution: log_uniform_values
        min: 0.1
        max: 2.0
  optimizer_config:
    parameters:
      lr0:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0e-2
      lrf:
        distribution: log_uniform_values
        min: 1.0e-7
        max: 1.0e-4
      weight_decay:
        distribution: log_uniform_values
        min: 1.0e-6
        max: 0.1
      transition_steps:
        values: [1000, 3000, 10000, 30000]
      decay_rate:
        distribution: uniform
        min: 0.5
        max: 0.999
      batch_size:
        values: [4096, 8192, null]

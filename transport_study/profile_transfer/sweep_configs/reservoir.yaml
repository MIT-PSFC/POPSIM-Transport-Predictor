method: bayes
metric:
  name: "val/loss.mean"
  goal: "minimize"
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 2
parameters:
  model_init_config:
    parameters:
      reservoir_size:
        values: [16, 32, 64, 128, 256, 512, 1024, 1920]
      spectral_radius:
        distribution: uniform
        min: 0.5
        max: 1.2
      input_scaling:
        distribution: log_uniform_values
        min: 0.05
        max: 2.0
      leak_rate:
        distribution: uniform
        min: 0.2
        max: 1.0
      n_steps:
        values: [5, 10, 20, 40]
  optimizer_config:
    parameters:
      lr0:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0e-2
      # Final learning rate as a fraction of lr0, never above it
      lrf_frac:
        distribution: log_uniform_values
        min: 1.0e-3
        max: 1.0
      weight_decay:
        distribution: log_uniform_values
        min: 1.0e-6
        max: 0.1
      # Fraction of the run's optimizer steps per 10x learning-rate decay,
      # resolved to transition_steps from the run's own steps_per_epoch * max_epochs at train time.
      # Horizon-invariant, a tuned schedule carries over to other epoch budgets and batch sizes
      transition_frac:
        distribution: log_uniform_values
        min: 0.03
        max: 3.0
      # Only ln(decay_rate) / transition_frac shapes the decay, so transition_frac alone sweeps it
      decay_rate:
        value: 0.1
  loss_config:
    parameters:
      # Deltas act on chi, the residual in GP-fit error bars (trb_utils.huber_profile_loss).
      # Safe to sweep, the sweep metric val/loss.mean is the delta-free
      # validation loss (trb.get_val_loss_fn)
      huber_delta:
        distribution: log_uniform_values
        min: 0.1
        max: 10.0
      huber_delta_grad:
        distribution: log_uniform_values
        min: 0.3
        max: 30.0
